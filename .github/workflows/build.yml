name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install fontconfig and fonts
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev fonts-liberation

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release --parallel

      # a quick subset; coma also draws text, which exercises font loading
      - name: Run examples
        shell: bash
        run: |
          mkdir -p run && cd run
          prog() { if [ -f ../build/Release/$1.exe ]; then echo ../build/Release/$1.exe; else echo ../build/$1; fi; }
          $(prog color)
          $(prog coma)
          $(prog render) testFormat
          ls -l output

      - uses: actions/upload-artifact@v4
        with:
          name: output-${{ matrix.os }}
          path: run/output
